name: Vybe Core

on:
  push:
    paths:
      - 'vybe_core/**'
      - '.github/workflows/vybe-core.yml'
  pull_request:
    paths:
      - 'vybe_core/**'
      - '.github/workflows/vybe-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Vybe Core test dependencies
        run: >-
          python -m pip install
          pytest
          pytest-asyncio
          sqlalchemy
          'psycopg[binary]'
      - name: Run Vybe core tests
        run: python -m pytest -q vybe_core/tests
