name: Vybe Core

on:
  push:
    paths:
      - 'vybe_core/**'
      - 'vybe_api/**'
      - '.github/workflows/vybe-core.yml'
  pull_request:
    paths:
      - 'vybe_core/**'
      - 'vybe_api/**'
      - '.github/workflows/vybe-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vybe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vybe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VYBE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/vybe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Vybe test dependencies
        run: >-
          python -m pip install
          pytest
          pytest-asyncio
          sqlalchemy
          'psycopg[binary]'
          fastapi
          httpx
      - name: Run Vybe core and API tests
        run: python -m pytest -q vybe_core/tests vybe_api/tests
